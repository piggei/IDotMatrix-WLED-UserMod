; WLED iDotMatrix Usermod - Waveshare ESP32-S3-RGB-Matrix qualification profile
; iDotMatrix release 0.9.4 / build 0.9.4-rc.1
;
; Development baseline: WLED 17.0.0-devV5
; Upstream hardware environment: env:waveshare_esp32s3_32MB_hub75
; Local short environment: env:waveshare
; Hardware: Waveshare ESP32-S3-RGB-Matrix, ESP32-S3-N32R16
;           32 MB flash / 16 MB PSRAM + HUB75
; Initial qualification display: one 64x64 HUB75 panel, Half Scan, 1x1.
;
; IMPORTANT:
; - This profile intentionally inherits the upstream Waveshare board definition,
;   HUB75 pinout/backend, 32 MB partition table, OTA policy, PSRAM configuration,
;   ES8311 audio pin definitions and SD-card flags.
; - WLED 17.0.0-devV5 currently declares SHTC3_v2 using a GitHub /commit/ page
;   URL, which PlatformIO cannot clone. The custom_usermods list is repeated here
;   so that dependency can be pinned with a cloneable Git URL while preserving
;   Internal_Temperature and AudioReactive.
; - The current 0.9.4 profile enables the qualified Waveshare-only GIF source
;   stage/cache/prefetch policy and disables the legacy low-memory Rescale UI.
;   Native WLED 2D output scaling remains automatic for 16x16/32x32/64x64.
;
; If you keep several board profiles in one global platformio_override.ini,
; merge this [env:waveshare] section into that file and continue building with:
;   pio run -e waveshare

[env:waveshare]
extends = env:waveshare_esp32s3_32MB_hub75

build_flags =
  ${env:waveshare_esp32s3_32MB_hub75.build_flags}
  -D IDOT_GIF_LZW12
  -D IDOT_SCREEN_MAX_DIM=64
  -D IDOT_DEFAULT_SCREEN_TYPE=0x04
  -D IDOT_S3_HUB75_WLED_IDF5
  -D IDOT_LOW_MEMORY_RESCALE=0
  -D IDOT_WAVESHARE_S3_RGB_MATRIX

lib_deps =
  ${env:waveshare_esp32s3_32MB_hub75.lib_deps}
  h2zero/NimBLE-Arduino@2.5.1
  bitbank2/AnimatedGIF@1.4.7

; Do not inherit the upstream Waveshare custom_usermods list here:
; that list contains the non-cloneable SHTC3_v2 /commit/ URL in devV5.
custom_usermods =
  Internal_Temperature
  audioreactive = https://github.com/MoonModules/WLED-AudioReactive-Usermod#8d988e985901e00a0a92e119aaa8e3249f817754
  SHTC3_v2 = git+https://github.com/lost-hope/SHTC3_v2.git#1f6e3fc7d6135b704aa41fadf09a36cbf6712834
  symlink://../wled-usermod-idotmatrix
