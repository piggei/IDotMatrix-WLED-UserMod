; WLED iDotMatrix Usermod - release 0.9.4 / build 0.9.4-rc.1 MatrixPortal qualification profile
; Adafruit MatrixPortal ESP32-S3 + native WLED HUB75 + 64x64 iDotMatrix profile
;
; Qualified WLED baseline: 17.0.0-devV5
; Commit: 06ae26db67107cb3f6a3d107a92340035991a063
; using the official env:adafruit_matrixportal_esp32s3 environment.
;
; This profile deliberately inherits the exact WLED HUB75 board/pinout,
; ESP-IDF 5.x stack, PSRAM setup, partition table and OTA policy from the
; upstream MatrixPortal environment. It adds only iDotMatrix-specific flags,
; NimBLE 2.x and the external Usermod.
;
; Expected hardware: Adafruit MatrixPortal S3 (8 MB flash / 2 MB PSRAM)
;                    + one 64x64 HUB75 panel.
;
; The 64x64 iDotMatrix screen type is the default for a fresh configuration.
; Native output scaling is automatic, so the legacy low-memory Rescale control
; is intentionally hidden/forced off on this S3 HUB75 target.
; WLED's default usermods (currently including AudioReactive) are preserved.
;
; dev.16 MatrixPortal PSRAM policy (dev.15 hardware-gate driven):
; - transient whole-file GIF source staging remains 256 KiB max / 1 MiB reserve;
; - persistent durable-Carousel source cache remains 384 KiB total;
; - per-entry source limit remains 256 KiB, with up to 8 metadata entries;
; - one-item Carousel look-ahead prefetch is now enabled after the cache-only gate passed.

[env:adafruit_matrixportal_esp32s3_idotmatrix_64x64]
extends = env:adafruit_matrixportal_esp32s3

build_flags =
  ${env:adafruit_matrixportal_esp32s3.build_flags}
  -D IDOT_GIF_LZW12
  -D IDOT_SCREEN_MAX_DIM=64
  -D IDOT_DEFAULT_SCREEN_TYPE=0x04
  -D IDOT_S3_HUB75_WLED_IDF5
  -D IDOT_LOW_MEMORY_RESCALE=0
  -D IDOT_GIF_PSRAM_STAGE_MAX=262144
  -D IDOT_GIF_PSRAM_STAGE_RESERVE=1048576
  -D IDOT_GIF_PSRAM_SOURCE_CACHE_MAX_BYTES=393216
  -D IDOT_GIF_PSRAM_SOURCE_CACHE_ENTRY_MAX=262144
  -D IDOT_GIF_PSRAM_SOURCE_CACHE_MAX_ENTRIES=8
  -D IDOT_GIF_CAROUSEL_PREFETCH_ENABLED=1

lib_deps =
  ${env:adafruit_matrixportal_esp32s3.lib_deps}
  h2zero/NimBLE-Arduino@2.5.1
  bitbank2/AnimatedGIF@1.4.7

custom_usermods =
  ${common.default_usermods}
  symlink://../wled-usermod-idotmatrix
