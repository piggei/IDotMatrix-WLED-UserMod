; WLED iDotMatrix Usermod - ESP32-C3 16x16 + AudioReactive + OTA profile
; Required WLED base commit:
;   d55037f7510541eddc390c8f3d01afc5787aa44a (2026-09-07)
;
; Hardware validation baseline:
;   - ESP32-C3 SuperMini, 4 MB flash
;   - WS2812B 16x16 matrix
;   - three consecutive successful WLED OTA updates
;   - 12 stored Carousel assets, six Preset assets and a three-activity Schedule
;   - BLE, shared-RMT output, GIF cache and AudioReactive active in the same build
;
; This profile uses a dual-slot 4 MB partition table with two 0x1A0000
; application slots, 0x0A0000 LittleFS and a 0x010000 coredump partition.
; The tested firmware.bin was ~1.55 MB, leaving ~149 KiB per OTA slot.
;
; This profile intentionally inherits the pinned WLED ESP32-C3 IDF5/shared-RMT
; stack. It includes AudioReactive and Animartrix because that exact combination
; was used during the OTA/memory stress qualification.

[env:esp32c3dev_idotmatrix_audio_16x16_ota]
extends = env:esp32c3dev
board_build.partitions = ../wled-usermod-idotmatrix/partitions/WLED_ESP32_4MB_IDOT_OTA.csv
board_build.filesystem = littlefs

build_flags =
  ${env:esp32c3dev.build_flags}
  -D IDOT_GIF_LZW12
  -D IDOT_SCREEN_MAX_DIM=16
  -D IDOT_C3_WLED_IDF5
  -D WLED_DISABLE_ALEXA
  -D WLED_DISABLE_HUESYNC
  -D WLED_DISABLE_MQTT
  -D WLED_DISABLE_INFRARED
  -D WLED_DISABLE_ADALIGHT
  -D WLED_DISABLE_LOXONE

lib_deps =
  ${env:esp32c3dev.lib_deps}
  h2zero/NimBLE-Arduino@2.5.1
  bitbank2/AnimatedGIF@1.4.7

custom_usermods =
  audioreactive
  animartrix
  wled-usermod-idotmatrix = symlink://../wled-usermod-idotmatrix
